# ============================================================
# Aurelius — Build & Release Workflow
# ============================================================
# Triggers:
#   • Push to the `release` branch  →  builds the desktop app
#     and creates a draft GitHub Release with the installer +
#     updater artifacts (latest.json, .nsis.zip, .nsis.zip.sig).
#   • Manual dispatch from the Actions tab.
#
# The tauri-action automatically:
#   1. Reads the version from tauri.conf.json
#   2. Creates a git tag  (e.g. v0.2.0)
#   3. Creates a draft GitHub Release
#   4. Uploads the .exe installer, updater bundle, signatures,
#      and latest.json to the release
#
# Secrets required (Settings → Secrets → Actions):
#   TAURI_SIGNING_PRIVATE_KEY          — content of .tauri/aurelius.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD — leave empty if key has no password
# ============================================================

name: Release

on:
  push:
    branches:
      - release
  workflow_dispatch:

jobs:
  publish-tauri:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      # ── Get version ──
      - name: Get version
        id: get_version
        run: |
          $version = (Get-Content apps/web/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          echo "VERSION=$version" >> $env:GITHUB_ENV
          echo "version=$version" >> $env:GITHUB_OUTPUT

      # ── Checkout ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Setup Bun ─────────────────────────────────────────────
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # ── Setup Node (needed by some npm deps / tauri action) ──
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # ── Setup Rust ────────────────────────────────────────────
      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      # ── Rust cache ────────────────────────────────────────────
      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./apps/web/src-tauri -> target"

      # ── Install all workspace dependencies ────────────────────
      - name: Install dependencies
        run: bun install

      # ── Build the backend sidecar ─────────────────────────────
      # The sidecar must exist before `tauri build` because it is
      # declared in externalBin. We compile the Elysia backend to
      # a standalone Bun binary.
      - name: Build backend sidecar
        run: bun run build:sidecar

      # ── Build Tauri app (NSIS installer + updater artifacts) ──
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/web
          tauriScript: bun run tauri

      # ── Create GitHub Release ──
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.VERSION }}
          name: "Aurelius v${{ env.VERSION }}"
          draft: true
          prerelease: false
          body: |
            ## What's new

            See the [full changelog](https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}) for details.

            ---

            ### Install / Update
            - **New install:** Download `Aurelius_x64-setup.exe` below and run it.
            - **Existing users:** The app will prompt you to update automatically.
          files: |
            apps/web/src-tauri/target/release/bundle/nsis/Aurelius_*_x64-setup.exe
            apps/web/src-tauri/target/release/bundle/nsis/Aurelius_*_x64-setup.exe.sig
            apps/web/src-tauri/target/release/bundle/nsis/latest.json
