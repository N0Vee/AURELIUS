<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aurelius Browser Control</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      background: #0f0f0f;
      color: #e5e5e5;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px 12px;
      border-bottom: 1px solid #1e1e1e;
    }

    .logo {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
    }

    .header-text h1 {
      font-size: 13px;
      font-weight: 600;
      color: #f5f5f5;
      letter-spacing: 0.01em;
    }

    .header-text p {
      font-size: 11px;
      color: #666;
      margin-top: 1px;
    }

    /* ── Status card ── */
    .status-card {
      margin: 12px 16px;
      padding: 12px 14px;
      border-radius: 8px;
      background: #161616;
      border: 1px solid #222;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      transition: background 0.3s, box-shadow 0.3s;
    }

    .status-dot.connected {
      background: #22c55e;
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2);
    }

    .status-dot.disconnected {
      background: #ef4444;
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15);
    }

    .status-dot.connecting {
      background: #f59e0b;
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    .status-info {
      flex: 1;
      min-width: 0;
    }

    .status-label {
      font-weight: 600;
      font-size: 13px;
    }

    .status-label.connected    { color: #22c55e; }
    .status-label.disconnected { color: #ef4444; }
    .status-label.connecting   { color: #f59e0b; }

    .status-sub {
      font-size: 11px;
      color: #555;
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Section ── */
    .section {
      padding: 0 16px 14px;
    }

    .section-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #555;
      margin-bottom: 8px;
    }

    /* ── URL input row ── */
    .input-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .url-input {
      flex: 1;
      background: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 12px;
      color: #e5e5e5;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      outline: none;
      transition: border-color 0.15s;
    }

    .url-input:focus {
      border-color: #6366f1;
    }

    .url-input::placeholder {
      color: #444;
    }

    .btn {
      padding: 7px 12px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: opacity 0.15s, background 0.15s;
      white-space: nowrap;
    }

    .btn:active { opacity: 0.7; }

    .btn-primary {
      background: #6366f1;
      color: #fff;
    }

    .btn-primary:hover { background: #4f51d9; }

    .btn-ghost {
      background: #1e1e1e;
      color: #aaa;
      border: 1px solid #2a2a2a;
    }

    .btn-ghost:hover { background: #252525; color: #e5e5e5; }

    /* ── Toast feedback ── */
    .toast {
      margin: 0 16px 12px;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      display: none;
    }

    .toast.success {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.25);
      color: #4ade80;
    }

    .toast.error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: #f87171;
    }

    .toast.visible { display: block; }

    /* ── Divider ── */
    .divider {
      height: 1px;
      background: #1a1a1a;
      margin: 0 16px 14px;
    }

    /* ── Actions row ── */
    .actions {
      padding: 0 16px 16px;
      display: flex;
      gap: 6px;
    }

    .actions .btn { flex: 1; text-align: center; }

    /* ── Footer ── */
    .footer {
      padding: 10px 16px;
      border-top: 1px solid #1a1a1a;
      font-size: 10px;
      color: #444;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="logo">🏛</div>
    <div class="header-text">
      <h1>Aurelius</h1>
      <p>Browser Control Extension</p>
    </div>
  </div>

  <!-- Status card -->
  <div class="status-card">
    <div class="status-dot connecting" id="statusDot"></div>
    <div class="status-info">
      <div class="status-label connecting" id="statusLabel">Connecting…</div>
      <div class="status-sub" id="statusSub">Establishing connection to backend</div>
    </div>
  </div>

  <!-- Backend URL config -->
  <div class="section">
    <div class="section-label">Backend WebSocket URL</div>
    <div class="input-row">
      <input
        type="text"
        class="url-input"
        id="wsUrlInput"
        placeholder="ws://localhost:3001/browser/ws"
        spellcheck="false"
      />
      <button class="btn btn-primary" id="saveUrlBtn">Save</button>
    </div>
  </div>

  <!-- Toast feedback -->
  <div class="toast" id="toast"></div>

  <div class="divider"></div>

  <!-- Action buttons -->
  <div class="actions">
    <button class="btn btn-ghost" id="reconnectBtn">⟳ Reconnect</button>
    <button class="btn btn-ghost" id="resetUrlBtn">Reset URL</button>
  </div>

  <!-- Footer -->
  <div class="footer">
    Zen Browser · Aurelius v1.0.0
  </div>

  <script src="popup.js"></script>
</body>
</html>
