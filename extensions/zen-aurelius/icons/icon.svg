<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="aGrad" x1="64" y1="14" x2="64" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#f8b820"/>
      <stop offset="50%"  stop-color="#df8810"/>
      <stop offset="100%" stop-color="#b86400"/>
    </linearGradient>
  </defs>

  <!-- Navy background with rounded corners -->
  <rect width="128" height="128" rx="22" fill="#1b2337"/>

  <!-- Left leg of A: peak → outer-bottom-left → inner-bottom-left -->
  <polygon points="64,14 13,108 34,108" fill="url(#aGrad)"/>

  <!-- Right leg of A: peak → inner-bottom-right → outer-bottom-right -->
  <polygon points="64,14 94,108 115,108" fill="url(#aGrad)"/>

  <!-- Inner upward-pointing triangle (silver/gray) -->
  <polygon points="64,63 50,89 78,89" fill="#cdd2de"/>
</svg>
